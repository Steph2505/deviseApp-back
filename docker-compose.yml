services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devis_app
    restart: unless-stopped
    volumes:
      - .:/var/www
      - /var/www/vendor
    depends_on:
      - mysql
    networks:
      - devis_network

  nginx:
    image: nginx:alpine
    container_name: devis_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - devis_network

  mysql:
    image: mysql:8.0
    container_name: devis_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - devis_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: devis_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - devis_network

volumes:
  mysql_data:

networks:
  devis_network:
    driver: bridge
